# Example Home Assistant package for OpenDTU NPB-450 abstract control mode.
# Place in Home Assistant as e.g. packages/opendtu_npb450.yaml and enable packages.

mqtt:
  switch:
    - name: "NPB450 Control Enable"
      unique_id: "npb450_control_enable"
      command_topic: "solar/meanwell/npb450/control/enable"
      payload_on: "ON"
      payload_off: "OFF"
      state_topic: "solar/meanwell/npb450/status/control_enabled"
      state_on: "1"
      state_off: "0"

  number:
    - name: "NPB450 Target Watt"
      unique_id: "npb450_target_w"
      command_topic: "solar/meanwell/npb450/control/target_w"
      state_topic: "solar/meanwell/npb450/status/target_w"
      min: 0
      max: 450
      step: 10
      mode: slider

    - name: "NPB450 Charge Voltage"
      unique_id: "npb450_charge_voltage_v"
      command_topic: "solar/meanwell/npb450/config/charge_voltage_v"
      state_topic: "solar/meanwell/npb450/status/target_vout"
      min: 12.0
      max: 14.6
      step: 0.1
      mode: box

    - name: "NPB450 Max Current"
      unique_id: "npb450_max_current_a"
      command_topic: "solar/meanwell/npb450/config/max_current_a"
      min: 0
      max: 40
      step: 0.5
      mode: box

  sensor:
    - name: "NPB450 Init State"
      unique_id: "npb450_init_state"
      state_topic: "solar/meanwell/npb450/status/init_state"

    - name: "NPB450 EEPROM Lock OK"
      unique_id: "npb450_eeprom_lock_ok"
      state_topic: "solar/meanwell/npb450/status/eeprom_lock_ok"

    - name: "NPB450 PSU Mode OK"
      unique_id: "npb450_psu_mode_ok"
      state_topic: "solar/meanwell/npb450/status/psu_mode_ok"

    - name: "NPB450 Measured Current"
      unique_id: "npb450_iout_actual"
      state_topic: "solar/meanwell/npb450/status/iout_actual"
      unit_of_measurement: "A"
      device_class: current

input_number:
  zero_export_deadband_w:
    name: Zero Export Deadband
    min: 0
    max: 300
    step: 10
    unit_of_measurement: "W"
    initial: 40

automation:
  - alias: "NPB450 Zero Export Abstract Control"
    id: "npb450_zero_export_abstract"
    mode: restart
    trigger:
      - platform: time_pattern
        seconds: "/2"
    condition:
      - condition: state
        entity_id: switch.npb450_control_enable
        state: "on"
      - condition: template
        value_template: "{{ states('sensor.npb450_init_state') == 'ready' }}"
      - condition: template
        value_template: "{{ states('sensor.npb450_eeprom_lock_ok') == '1' }}"
      - condition: template
        value_template: "{{ states('sensor.npb450_psu_mode_ok') == '1' }}"
    action:
      - variables:
          export_w: "{{ states('sensor.grid_export_power') | float(0) }}"
          deadband: "{{ states('input_number.zero_export_deadband_w') | float(40) }}"
          target_w: "{{ [0, export_w - deadband] | max | round(0) }}"
      - service: mqtt.publish
        data:
          topic: "solar/meanwell/npb450/control/target_w"
          payload: "{{ [target_w, 430] | min }}"

  - alias: "NPB450 Stop At Night"
    id: "npb450_stop_at_night"
    trigger:
      - platform: sun
        event: sunset
        offset: "+00:20:00"
    action:
      - service: mqtt.publish
        data:
          topic: "solar/meanwell/npb450/control/enable"
          payload: "OFF"
      - service: mqtt.publish
        data:
          topic: "solar/meanwell/npb450/control/target_w"
          payload: "0"
